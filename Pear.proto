# A red pear (0.06 x 0.08 x 0.06 m) using pear.png texture.
# template language: javascript

PROTO Pear [
  field SFVec3f    translation         0 0 0.05
  field SFRotation rotation            0 0 1 0
  field SFString   name                "pear"
  field SFFloat    scale               1
  field SFFloat    mass                0.15      # Defines the mass of the pear in kg.
  field MFNode     immersionProperties []        # Is `Solid.immersionProperties`.
]
{
  Solid {
    translation IS translation
    rotation IS rotation
    recognitionColors [1 0 0] # red hue for recognition
    children [
      Transform {
        scale %<= fields.scale.value >% %<= fields.scale.value >% %<= fields.scale.value >%
        children [
          Shape {
            appearance PBRAppearance {
              baseColorMap ImageTexture {
                url [
                  "pear_texture.png"
                ]
              }
              metalness 0
              roughness 0.3
            }
            geometry Sphere {
              radius 0.05
              subdivision 3
            }
          }
        ]
      }
    ]
    name IS name
    model "pear"
    immersionProperties IS immersionProperties
    boundingObject Sphere {
      radius %<= fields.scale.value * 0.05 >%
    }
    physics Physics {
      density -1
      mass IS mass
    }
  }
}
